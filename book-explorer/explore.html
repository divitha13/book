<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Book Explorer: search millions of books using the free Open Library API.">
  <title>Explore | Book Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Book Explorer</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="explore.html" aria-current="page">Explore</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="container">
    <h1>Explore books</h1>
    <form id="search-form" class="toolbar" role="search">
      <div class="field search-field">
        <label for="q">Search by title or author</label>
        <input id="q" name="q" type="search" placeholder="e.g. Harry Potter" required>
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="">Any subject</option>
          <option value="fiction">Fiction</option>
          <option value="science">Science</option>
          <option value="history">History</option>
          <option value="fantasy">Fantasy</option>
          <option value="romance">Romance</option>
          <option value="computers">Computers</option>
        </select>
      </div>
      <div class="field">
        <label for="decade">Published in</label>
        <select id="decade" name="decade">
          <option value="">Any decade</option>
        </select>
      </div>
      <button class="btn" type="submit">Search</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="message" aria-live="assertive"></div>
    <ul id="results" class="grid"></ul>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>Book data from <a href="https://openlibrary.org">Open Library</a>. Built as a second-year web project.</p>
    </div>
  </footer>
  <script src="js/explore.js"></script>
</body>
</html>
